<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoForce Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f4f6f8;
      color: #333;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #1565c0;
      border-bottom: 2px solid #1565c0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 960px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }

    h2 { font-size: 1rem; color: #555; margin-bottom: 1rem; }

    /* LED */
    .led-row { display: flex; align-items: center; gap: 1rem; }

    #led-status {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 4px;
      font-weight: 700;
      min-width: 3.5rem;
      text-align: center;
      background: #e0e0e0;
      color: #757575;
    }
    #led-status.on { background: #43a047; color: #fff; }

    button {
      padding: 0.4rem 1.1rem;
      border: none;
      border-radius: 4px;
      background: #1976d2;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1565c0; }
    button:disabled { opacity: 0.5; cursor: default; }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .table-header h2 { margin: 0; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #f0f0f0; }
    th { background: #fafafa; font-weight: 600; color: #555; }

    tr.arrival  td.type { color: #2e7d32; font-weight: 700; }
    tr.departure td.type { color: #c62828; font-weight: 700; }

    #empty-msg { color: #999; font-style: italic; padding: 1rem 0; }
  </style>
</head>
<body>

  <h1>GeoForce — Station Monitor</h1>

  <div class="card">
    <h2>LED Control</h2>
    <div class="led-row">
      <span id="led-status">OFF</span>
      <button id="led-btn" onclick="toggleLed()">Turn ON</button>
    </div>
  </div>

  <div class="card">
    <div class="table-header">
      <h2>Event Log</h2>
      <button onclick="refreshEvents()">Refresh</button>
    </div>
    <p id="empty-msg" style="display:none">No events recorded yet.</p>
    <table id="events-table" style="display:none">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Type</th>
          <th>Badge</th>
          <th>Station</th>
        </tr>
      </thead>
      <tbody id="events-body"></tbody>
    </table>
  </div>

  <script>
    const ARCHIVE = 'http://localhost:3003';
    const CONTROL = 'http://localhost:3002';

    let ledState = false;

    async function refreshLed() {
      try {
        const res  = await fetch(`${CONTROL}/led`);
        const data = await res.json();
        setLedState(data.state);
      } catch (error) {
        console.warn('Control unreachable', error);
      }
    }

    function setLedState(state) {
      ledState = state;
      const status = document.getElementById('led-status');
      const btn    = document.getElementById('led-btn');
      status.textContent = state ? 'ON' : 'OFF';
      status.className   = state ? 'on' : '';
      btn.textContent    = state ? 'Turn OFF' : 'Turn ON';
    }

    async function toggleLed() {
      const btn = document.getElementById('led-btn');
      btn.disabled = true;
      try {
        const res  = await fetch(`${CONTROL}/led`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ state: !ledState }),
        });
        const data = await res.json();
        setLedState(data.state);
      } catch (error) {
        console.error('LED toggle failed', error);
      } finally {
        btn.disabled = false;
      }
    }

    async function refreshEvents() {
      try {
        const res    = await fetch(`${ARCHIVE}/events`);
        const events = await res.json();

        const tbody    = document.getElementById('events-body');
        const table    = document.getElementById('events-table');
        const emptyMsg = document.getElementById('empty-msg');

        if (events.length === 0) {
          table.style.display    = 'none';
          emptyMsg.style.display = '';
          return;
        }

        table.style.display    = '';
        emptyMsg.style.display = 'none';

        tbody.innerHTML = [...events].reverse().map(event => `
          <tr class="${event.event}">
            <td>${new Date(event.timestamp).toLocaleString()}</td>
            <td class="type">${event.event}</td>
            <td>${event.badge_id}</td>
            <td>${event.station_id}</td>
          </tr>
        `).join('');
      } catch (error) {
        console.warn('Archive unreachable', error);
      }
    }

    refreshLed();
    refreshEvents();
    // setInterval(refreshLed, 5000);
    setInterval(refreshEvents, 5000);
  </script>
</body>
</html>
